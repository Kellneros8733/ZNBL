c.lineCap=c.lineJoin='round';
let seed=0,k=0,TR=1;
const R=()=>{const x=Math.sin(++k*12.9898+seed*78.233)*43758.5453;return(x-Math.floor(x)-.5)*2*TR};
function ln(a,b,d,e){c.beginPath();c.moveTo(a+R(),b+R());c.quadraticCurveTo((a+d)/2+R()*2,(b+e)/2+R()*2,d+R(),e+R());c.stroke()}
function rc(x,y,w,h,f){if(f){c.fillStyle=f;c.fillRect(x,y,w,h)}ln(x,y,x+w,y);ln(x+w,y,x+w,y+h);ln(x+w,y+h,x,y+h);ln(x,y+h,x,y)}
function ci(x,y,r,f){c.beginPath();for(let i=0;i<=14;i++){const a=i/14*6.4;c.lineTo(x+Math.cos(a)*r+R(),y+Math.sin(a)*r+R())}if(f){c.fillStyle=f;c.fill()}c.stroke()}
function hat(x,y,w,h,s=9){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.lineWidth=1.5;for(let i=-h;i<w;i+=s)ln(x+i,y+h,x+i+h,y);c.restore()}
function tx(t,x,y,s=22,al='left',col='#222'){c.font=s+'px '+FONT;c.textAlign=al;c.fillStyle=col;c.fillText(t,x,y)}
function wrap(t,w){const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(wd=>{const n=l?l+' '+wd:wd;if(c.measureText(n).width>w&&l){o.push(l);l=wd}else l=n});o.push(l)});return o}
function at(x,y,s,f){c.save();c.translate(x,y);c.scale(s,s);f();c.restore()}
function arrow(x,y,d){ln(x-18*d,y,x+18*d,y);ln(x+18*d,y,x+6*d,y-12);ln(x+18*d,y,x+6*d,y+12)}

const NOHA=()=>rc(-6,-24,12,48,'#e8d3a8'),NUZ=()=>{rc(-22,-4,26,8,'#ddd');rc(4,-6,18,12,'#8a5')},GLV=()=>ci(0,6,13,'#c33');

 nuznoha:{n:'Oštěp z nohy a nože',d(){c.save();c.rotate(.6);rc(-4,-22,8,50,'#e8d3a8');c.fillStyle='#ddd';c.beginPath();c.moveTo(-10,-22);c.lineTo(0,-48);c.lineTo(10,-22);c.closePath();c.fill();c.stroke();ln(-5,-18,5,-12);ln(-5,-8,5,-2);ln(-5,2,5,8);c.restore()}},

 lahvicka:{n:'Uspávadlo',d(){rc(-8,-14,16,28,'#9cf');rc(-4,-22,8,8)}},
 ponozka:{n:'Ponožka',d(){rc(-8,-16,16,22,'#ccc');rc(-8,6,22,10,'#ccc')}},
 hadicka:{n:'Hadička z kapačky',d(){ln(-20,8,-6,-8);ln(-6,-8,6,8);ln(6,8,20,-8)}},

 injekce:{n:'Injekce',d(){rc(-18,-4,26,8,'#ddd');ln(8,0,22,0)}},
 propiska:{n:'Propiska',d(){rc(-20,-3,40,6,'#46c')}},
 obal:{n:'Zmuchlaný obal',d(){ci(0,0,12,'#e8c88a');ln(-8,-8,8,8)}},
 obalp:{n:'Narovnaný obal',d(){rc(-14,-10,28,20,'#e8c88a')}},
 cedule:{n:'Cedule NERUŠIT',d(){rc(-16,-12,32,24,'#f5e9c6');ln(-10,-3,10,-3);ln(-10,4,10,4)}},
 cedulaInj:{n:'Připravená cedule',d(){rc(-16,-12,32,24,'#f5e9c6');ln(-10,-3,10,-3);ln(-4,-14,6,10)}},
 zarazka:{n:'Těžká zarážka',d(){rc(-12,-10,24,20,'#777')}},ponozkaS:{n:'Smradlavá ponožka',d(){rc(-8,-16,16,22,'#9b8');rc(-8,6,22,10,'#9b8');ln(-4,-26,4,-20)}},mrkev:{n:'Mrkev',d(){c.save();c.rotate(.6);ln(-4,-18,0,16);ln(4,-18,0,16);ln(-4,-18,4,-18);ln(-2,-18,-4,-26);ln(2,-18,4,-26);c.restore()}},pruzina:{n:'Pružina',d(){for(let i=0;i<5;i++){ln(-12,-16+i*8,12,-12+i*8)}}},fotak:{n:'Foťák',d(){rc(-16,-10,32,22,'#333');ci(0,1,8,'#9cf')}},mys:{n:'Myš',d(){ci(0,0,9,'#aaa');ci(-7,-8,4,'#aaa');ci(7,-8,4,'#aaa');ln(9,2,22,10)}},spalek:{n:'Špalek',d(){rc(-18,-10,36,22,'#a85');hat(-18,-10,36,22,6)}},pacidlo:{n:'Páčidlo',d(){ln(-18,16,10,-14);ln(10,-14,18,-8)}},vajgl:{n:'Vajgl',d(){rc(-12,-3,22,6,'#fff');rc(6,-3,6,6,'#d96')}},
 ebon:{n:'Ebonitová tyč',d(){ln(-4,-24,4,24);ln(4,-24,8,24)}},liska:{n:'Vycpaná liška',d(){rc(-18,-8,30,16,'#d62');ci(18,-4,9,'#d62');ln(-18,0,-30,10)}},nabita:{n:'Nabitá tyč',d(){ln(-4,-24,4,24);ln(2,-30,-6,-20);ln(-6,-20,4,-14)}},router:{n:'Starý router',d(){rc(-20,-6,40,14,'#667');ln(-8,-6,-12,-20);ln(8,-6,12,-20)}},navod:{n:'Návod v němčině',d(){rc(-14,-16,28,32,'#fffdf4');ln(-8,-6,8,-6);ln(-8,2,8,2)}},bomba:{n:'Plynová bomba',d(){rc(-12,-20,24,40,'#c33');rc(-5,-28,10,8,'#555')}},
 negativy:{n:'Negativy',d(){rc(-16,-10,32,20,'#334');ln(-16,-3,16,-3);ln(-16,4,16,4)}},ethkabel:{n:'Ethernetový kabel',d(){ln(-18,6,-8,-8);ln(-8,-8,6,8);ln(6,8,18,-6)}},notebook:{n:'Notebook',d(){rc(-18,-12,36,22,'#bbb');rc(-24,10,48,5,'#999')}},

let P=null,S={mode:'title',prev:'title',q:[],cur:'',cb:null,act:null,tx:0,ty:470,ph:0,t:0,ang:0,sc:null,inv:false,sel:null,hint:false,D:null,menu:'main',toast:0,msg:''};
const F=()=>P.f,B=[];
function say(l,cb){S.q=l.slice();S.cur=S.q.shift();S.cb=cb||null;S.mode='dialog'}
function screen(pages,btn,cb){S.mode='screen';S.sc={pages,i:0,btn,cb}}
const nope=()=>say([NOPE]);
function give(id){P.inv.push(id)}
function drop(id){P.inv.splice(P.inv.indexOf(id),1)}
function go(s,x){P.scene=s;P.px=S.tx=x;P.py=S.ty=470;S.sel=null;autosave()}

const SK=n=>'zbl_'+n;
function sv(n){try{localStorage.setItem(SK(n),JSON.stringify({P,ts:new Date().toLocaleString('cs')}))}catch(e){}}
function rd(n){try{const r=localStorage.getItem(SK(n));return r?JSON.parse(r):null}catch(e){return null}}
function autosave(){sv('auto')}
function loadSlot(n){const d=rd(n);if(!d)return;P=d.P;S.ang=0;S.tx=P.px;S.ty=P.py;S.act=null;S.sel=null;S.mode='play'}

const INTRO=['[Hospoda. Cinkání sklenic, hluk. Hlasy FRANTY a PEPY.]','FRANTA: …a koukni se na ně, Pepo. Každej mladej v ruce telefon a nikdo neumí pozdravit.','PEPA: Za nás bylo líp, Franto. Za nás se lidi koukali do očí.','FRANTA: Na to se napijem!','PEPA: Jenže teďka… všecko je… na… dis…pleji a my… dddoo…','[Žbluňk. Pepa padá na zem.]','(sem přijdou tvoje nadabované dialogy)'];
const CTRL=['OVLÁDÁNÍ\nLevé tlačítko: chodit, mluvit, sbírat a používat\nPravé tlačítko nebo H: ukáže, co jde použít (Stará dobrá)\nI: inventář · Esc: menu','PŘEDMĚTY\nKlikni na předmět a pak na cíl, nebo ho přetáhni.\nKombinace: přetáhni předmět na jiný předmět v inventáři.'];
const WAKE=['Pepa: Ááách… hlava. Kde to… jo, doma. Nad mísou. Skvělý.','Pepa: Včera jsem s Frantou probíral, jak to bylo dřív. Pak tma. Aspoň že jsem se trefil dovnitř.','Pepa: Vstávej, mladej. Záchod je ucpanej a ty seš v hajzlu.','(placeholder monolog, dopíšeš)'];
function newGame(d){P={d,scene:'wc',px:480,py:470,inv:[],f:{},meter:100,trem:0,tm:d=='mlada'?450:null};S.ang=0;S.tx=480;S.ty=470;S.act=null;S.sel=null;S.inv=false;
 screen(INTRO,'Probudit se',()=>{S.mode='play';mark();autosave();say(WAKE)})}
function timeUp(){screen(['Pepa bez léků dál nevydržel. Dlouho u něj nenastal žádný posun.','KONEC\nZa nás bylo líp… ale ne dlouho.'],'Zkusit znovu',()=>{if(!P.chk){S.mode='title';P=null;return}const o=JSON.parse(P.chk);Object.assign(P,o);P.px=S.tx=o.px;P.py=S.ty=470;P.tm=450;S.ang=0;S.act=null;S.sel=null;S.mode='play'})}
function die(kind){screen(['Pepa vypil rum a spolkl poslední léky.','„Víš, co je na tom nejhorší? Že se nikdo nebude divit.\nZa nás bylo líp… jenže kdo je ten „my“?“\n\n(sem napiš vlastní dramatický monolog)','KONEC č. 1\nPro Pepu to nebyl nejlepší nápad.'],'Zkusit znovu',()=>{const q=F();q.alc=false;q.gRum=false;if(kind=='pills'){q.pills=false;q.brk=false;q.sk=2}S.mode='play'})}
function takePills(){if(F().alc){die('pills');return}F().pills=true;P.meter=100;if(P.tm!=null)P.tm=450;say(['Poslední kousek. No nic, hlavně že je to dole.',F().pj?'Mám léky i pyžamo. Jdu spát.':'V montérkách do postele nejdu, chtělo by to pyžamo.'])}
function bed(){const q=F();if(!q.pills)return say(['Bez léků neusnu.']);if(!q.pj)return say(['V montérkách do postele nejdu.']);S.mode='slip';S.t=0;S.ang=0;S.tx=330;S.ty=455;S.act=null}
function combine(a,b){let r=COMB[[a,b].sort().join('+')],keep;S.sel=null;if(r=='nuznoha'&&!F().rodCut)return say(['Pepa: Néé, nůž ještě předtím k něčemu potřebuju.']);if(Array.isArray(r)){keep=r[1];r=r[0]}if(r){if(a!=keep)drop(a);if(b!=keep)drop(b);give(r);if(r=='cedulaInj')F().signReady=true;say(COMBMSG[r]||['Spojeno: '+ITEMS[r].n])}else nope()}
const COMBMSG={nabita:['Pepa tře liščím ocasem o tyč. Pepa: Jasný, statická elektřina! Cha, já tě uškvařím, ty bestie. Ale jak to na něj převést…'],nuznoha:['Hotovo. Oštěp z nohy od stolku a nože. Žádná věda.'],cedule:['Napsal jsem vzkaz: NERUŠIT.'],cedulaInj:['Super, teď to jen připnout na dveře zvenku.']};
function choose(o){S.ch=o;S.mode='choice'}
const G=fn=>function(a){if(!F().nDone){say(['Nejdřív bych si měl promluvit se sestrou.']);return}return fn.call(this,a)};
function tk(flag,item,msg){const q=F();if(!q.sleep)return say(['Spolubydla by si toho všiml. Nejdřív ho musím uspat.']);q[flag]=true;give(item);say([msg])}
const WAKE2=['Pepa: Co… kde… (rozhlédne se) Nemocnice? Zase?','Doktor: Pane Panděro, jste vzhůru. Bouchl jste se do hlavy a upadl do kómatu.','Doktor: Zachránil vás soused, zavolal sanitku. Bez těch léků byste umřel. V nemocnici jsme vám je dali.','Doktor: Na další léky si zajděte na recepci pro e-předpis. (odchází)','(placeholder, dopíšeš a nadabuješ)'];
function act2(){P.scene='nem';P.px=S.tx=170;P.py=S.ty=470;P.inv=[];P.f={pj:true};S.ang=0;S.act=null;S.sel=null;P.meter=100;P.trem=0;P.tm=P.d=='mlada'?450:null;mark();autosave();S.mode='play';say(WAKE2,()=>say(['Doktor: Tak já vás tu nechám odpočívat.','(Doktor odchází. placeholder, dopíšeš a nadabuješ)'],()=>{F().docGone=true}))}
function endTreat(){screen(['Sestra: Z alkoholismu se budete muset léčit. Nikam vás nepustím.','Pepa zůstal v nemocnici na léčení.','KONEC\nVlastně jediný dobrý. Jeho cesta už se nikam dál nedostane.'],'Zkusit jinak',()=>{S.mode='play';nurse()})}
function nurse(){const q=F();if(q.nDone)return say(['Sestra: A nic mi tu nepokazte, pane Panděro.']);
 say(['Sestra: Pane Panděro! Vy zase? Aspoň že jste se probral.','(Je znát, že tu Pepa už byl a sestra ho nemusí.)'],()=>choose([{t:'„Sestro, nalejte mi panáka.“',f:()=>endTreat()},{t:'„Sestro, pusťte mě domů, jinak odejdu sám.“',f:()=>{S.mode='play';q.nDone=true;say(['Sestra: No co s váma mám dělat.','Pepa: (sám pro sebe) Přišel jsem sem jen ve svým pyžamu, takže si musím sehnat nějaký fešný hadry.','Pepa: Asi tam dojdu oknem, jen tady ten spolubydla by mě napráskal. Musím s ním něco udělat.'])}}]))}
function recep(){const q=F();
 if(!q.rTalk){q.rTalk=true;return say(['Recepční: Ten spolubydlící je důležitej cápek, ať si to s ním moc nerozhazujete. Má poslední hodinu života, měl vést důležitej hovor, tak ať ho prý nerušíte.','Pepa: (pro sebe) Musím zajistit, aby tam k němu nikdo nešel. Ať ho najdou až po smrti.','Pepa: Prej potřebuju recept na ty léky.','Recepční: Ale to je přece skvělý, e-recepty a digitalizace! Poslala jsem vám e-recept na e-mail.','Pepa: Já žádnej e-mail nemám! Na to kašlu, půjdu do lékárny bez toho!'])}
 if(q.signReady&&!q.asked)return choose([{t:'Poprosit o další e-mail',f:()=>{S.mode='play';q.asked=true;say(['Pepa: Pošlete mi ten recept ještě jednou. Že to teda zkusím.','Recepční: Jasně, hned! (začne čumět do počítače)','Pepa: Teď je moje chvíle.'])}},{t:'Nic',f:()=>{S.mode='play'}}]);
 say(['Recepční: Ještě něco, pane Panděro?'])}
function exitHosp(){const q=F();if(!q.signPlaced)return say(['Musím zajistit, aby do toho pokoje nikdo nešel, dokud ten spolubydla žije.']);
 if(!(q.gPon&&q.gHad&&q.gLek&&q.gInj&&q.gProp))return say(['Ještě něco by se mi mohlo hodit.']);
 say(['A teď rychle pryč.'],()=>go('lek',170))}

function frame(ts){seed=Math.floor(ts/140);k=0;B.length=0;update();
 c.fillStyle='#fbf8ef';c.fillRect(0,0,960,540);c.strokeStyle='#222';c.lineWidth=3;

const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*960/r.width,(e.clientY-r.top)*540/r.height]};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{const[x,y]=pt(e);
 if(e.button==2){S.hint=S.mode=='play';return}
 if(S.mode=='title'||S.mode=='menu'||S.mode=='choice'){const b=B.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);b&&b.f();return}
 if(S.mode=='dialog'){if(S.q.length)S.cur=S.q.shift();else{S.mode='play';const f=S.cb;S.cb=null;f&&f()}return}
 if(S.mode=='screen'){if(S.sc.i<S.sc.pages.length-1)S.sc.i++;else S.sc.cb();return}
 if(S.mode!='play')return;
 if(x>800&&y<40){S.prev='play';S.mode='menu';S.menu='main';return}
 if(x<140&&y<40){S.inv=!S.inv;return}
 const sl=slotAt(x,y);
 if(sl>=0){const id=P.inv[sl];if(S.sel&&S.sel!=id){combine(S.sel,id)}else S.D={id,x,y,sx:x,sy:y,moved:false};return}
 if(S.inv&&y<74)return;
 const o=hsAt(x,y);
 if(o)walkThen(o,S.sel);else if(y>=410&&y<=510){S.tx=x;S.ty=y;S.act=null;S.sel=null}else S.sel=null});
cv.addEventListener('pointermove',e=>{if(!S.D)return;const[x,y]=pt(e);S.D.x=x;S.D.y=y;if(Math.hypot(x-S.D.sx,y-S.D.sy)>8)S.D.moved=true});
cv.addEventListener('pointerup',e=>{if(e.button==2){S.hint=false;return}
 if(!S.D)return;const[x,y]=pt(e),d=S.D;S.D=null;
 if(!d.moved){S.sel=S.sel==d.id?null:d.id;return}
 const sl=slotAt(x,y);if(sl>=0&&P.inv[sl]!=d.id){combine(d.id,P.inv[sl]);return}
 const o=hsAt(x,y);if(o)walkThen(o,d.id)});
addEventListener('keydown',e=>{KEYS[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault();
 if(e.key=='Escape'){if(S.mode=='menu'){if(S.menu!='main')S.menu='main';else if(S.prev=='play')S.mode='play'}else if(S.mode=='play'){S.prev='play';S.mode='menu';S.menu='main'}}
 if((e.key=='i'||e.key=='I')&&S.mode=='play')S.inv=!S.inv;
 if((e.key=='h'||e.key=='H')&&S.mode=='play')S.hint=true});
addEventListener('keyup',e=>{delete KEYS[e.key.toLowerCase()];if(e.key=='h'||e.key=='H')S.hint=false});
requestAnimationFrame(frame);
